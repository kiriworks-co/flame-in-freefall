[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = [".venv", ".code-review-graph", "data", "resources"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
follow_imports = "silent"
check_untyped_defs = true
explicit_package_bases = true
